[package]
name = "launcher-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
sha1 = "0.10"
num-bigint = "0.4"
rand = "0.8"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
