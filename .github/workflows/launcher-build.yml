name: launcher-build

# Builds the Windows launcher (Tauri) and keeps the exe as a workflow artifact called RA-Realm-Launcher.
# Release.bat on the PC starts this, waits for it and puts the exe into the release. You do not run it by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - name: Install front-end packages
        working-directory: launcher
        run: npm ci

      - name: Build the launcher
        working-directory: launcher
        run: npx tauri build --no-bundle

      - name: Collect the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item launcher/src-tauri/target/release/ra-realm-launcher.exe out/RA-Realm-Launcher.exe
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: RA-Realm-Launcher
          path: out/RA-Realm-Launcher.exe
